name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloud-run
  cancel-in-progress: false

env:
  PROJECT_ID: master-diorama-489103-u2
  REGION: asia-south1
  SERVICE: kavis-npi-portal
  IMAGE: asia-south1-docker.pkg.dev/master-diorama-489103-u2/kavis/kavis-npi-portal

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Typecheck server and build client
        run: |
          npm ci --prefix server
          npm ci --prefix client
          npm run build

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/645830234926/locations/global/workloadIdentityPools/kavis-github/providers/github
          service_account: kavis-npi-deployer@master-diorama-489103-u2.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -t "${IMAGE}:${GITHUB_SHA}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"

      - name: Deploy new revision
        run: |
          gcloud run services update "${SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --image="${IMAGE}:${GITHUB_SHA}"

      - name: Smoke test
        run: |
          URL=$(gcloud run services describe "${SERVICE}" --project="${PROJECT_ID}" --region="${REGION}" --format='value(status.url)')
          curl -fsS -o /dev/null "${URL}/"
          echo "Deployed ${GITHUB_SHA} to ${URL}"
